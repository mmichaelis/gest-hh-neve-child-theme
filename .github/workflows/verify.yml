name: Static Verification

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  attestations: read
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh/install-actionlint.sh "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
        shell: bash
      - name: Run static verification
        run: pnpm run verify
