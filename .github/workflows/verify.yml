name: Static Verification

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  attestations: read
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --dir "${RUNNER_TEMP}"
          gh attestation verify --repo rhysd/actionlint "${archive}"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
        shell: bash
      - name: Run static verification
        run: pnpm run verify
